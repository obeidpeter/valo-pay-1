<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valo Pay 1 · Collections, credit and cash operations</title>
    <meta
      name="description"
      content="Try Collections, Pay by Bank, Credit Desk and Cash Desk with sample data. Built for Nigerian lenders and small businesses. Valo Pay 1 never holds money."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Valo Pay 1" />
    <meta
      property="og:description"
      content="Collections, credit and cash. One clear view. Try Valo Pay 1 with sample data. Live payments and bank connections are switched off."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Valo Pay 1" />
    <meta
      name="twitter:description"
      content="Try Collections, Pay by Bank, Credit Desk and Cash Desk with sample data. Valo Pay 1 never holds money."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Light or dark before the first paint: the same rule and key as src/lib/theme.ts, which takes over once the app runs. -->
    <script>
      var choice = null;
      try { choice = localStorage.getItem('valo-pay-1:__VALO_PAY_1_ENVIRONMENT__:theme'); } catch (error) { /* storage blocked: the device decides */ }
      var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
